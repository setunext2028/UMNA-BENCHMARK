[workspace]
resolver = "2"
members = [
    "runtime-abi",
    "runtime-registry", 
    "runtime-graph",
    "runtime-scheduler",
    "runtime-replay",
    "runtime-core",
    "runtime-executor",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "5.0"
anyhow = "1.0"
byteorder = "1.5"
sha2 = "0.10"
numpy = "0.16"
ndarray = "0.15"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1